<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive and keyboard-accessible image slider built with vanilla JavaScript.">
  <link rel="stylesheet" href="style.css">
  <title>Image Slider | JavaScript Project</title>
</head>
<body>
  <main class="page">
    <header class="page__header">
      <p class="eyebrow">Vanilla JavaScript Component</p>
      <h1>Image Slider</h1>
      <p>Browse the gallery using the controls, indicators, or arrow keys.</p>
    </header>
    <section class="slider" aria-label="Featured gallery" aria-roledescription="carousel">
      <div class="slides" aria-live="polite">
        <figure class="slide"><img src="images/news-01.png" alt="Featured gallery image one"></figure>
        <figure class="slide"><img src="images/news-02.png" alt="Featured gallery image two"></figure>
        <figure class="slide"><img src="images/news-03.png" alt="Featured gallery image three"></figure>
        <figure class="slide"><img src="images/news-04.png" alt="Featured gallery image four"></figure>
        <span class="slide-counter"></span>
      </div>
      <div class="controls">
        <button class="control previous" type="button">Previous</button>
        <div class="indicators" aria-label="Choose a slide"></div>
        <button class="control next" type="button">Next</button>
      </div>
    </section>
  </main>
  <script src="main.js"></script>
</body>
</html>
